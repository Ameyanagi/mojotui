name: Source artifact smoke

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  archive:
    name: Upload canonical source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create source archive and checksum
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-artifact"
          git archive --format=tar.gz --prefix=mojotui-smoke/ \
            --output="${RUNNER_TEMP}/source-artifact/mojotui-smoke.tar.gz" HEAD
          cd "${RUNNER_TEMP}/source-artifact"
          sha256sum mojotui-smoke.tar.gz > mojotui-smoke.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive-smoke
          path: |
            ${{ runner.temp }}/source-artifact/mojotui-smoke.tar.gz
            ${{ runner.temp }}/source-artifact/mojotui-smoke.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  restore:
    name: Restore source archive on ${{ matrix.name }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive-smoke
          path: ${{ runner.temp }}/archive
      - name: Verify and extract canonical source
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/archive"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check mojotui-smoke.tar.gz.sha256
          else
            shasum -a 256 --check mojotui-smoke.tar.gz.sha256
          fi
          mkdir -p "${RUNNER_TEMP}/source"
          tar -xzf mojotui-smoke.tar.gz --strip-components=1 \
            -C "${RUNNER_TEMP}/source"
          test -s "${RUNNER_TEMP}/source/pixi.toml"
          test -s "${RUNNER_TEMP}/source/pixi.lock"
          test -s "${RUNNER_TEMP}/source/mojotui/__init__.mojo"
          test -s "${RUNNER_TEMP}/source/conda.recipe/recipe.yaml"
          test ! -e "${RUNNER_TEMP}/source/.git"
