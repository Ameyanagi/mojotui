name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match tag, target, versions, dependencies, and changelog
        run: bash scripts/check-release-contract.sh

  archive:
    name: Build source archive once
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create source archive and checksum
        run: |
          set -euo pipefail
          archive="mojotui-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz \
            --prefix="mojotui-${GITHUB_REF_NAME}/" \
            --output="$archive" \
            "$GITHUB_SHA"
          sha256sum "$archive" >"${archive}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: |
            mojotui-${{ github.ref_name }}.tar.gz
            mojotui-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  source-check:
    name: Check source archive on ${{ matrix.name }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: source-archive
          path: ${{ runner.temp }}/archive
      - name: Extract canonical source
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/archive"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "mojotui-${GITHUB_REF_NAME}.tar.gz.sha256"
          else
            shasum -a 256 --check "mojotui-${GITHUB_REF_NAME}.tar.gz.sha256"
          fi
          mkdir -p "${RUNNER_TEMP}/source"
          tar -xzf "${RUNNER_TEMP}/archive/mojotui-${GITHUB_REF_NAME}.tar.gz" \
            --strip-components=1 -C "${RUNNER_TEMP}/source"
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: ${{ runner.temp }}/source
      - name: Verify canonical source
        working-directory: ${{ runner.temp }}/source
        run: pixi run --locked check

  package:
    name: Package source archive on ${{ matrix.name }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: source-archive
          path: ${{ runner.temp }}/archive
      - name: Extract canonical source
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/archive"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "mojotui-${GITHUB_REF_NAME}.tar.gz.sha256"
          else
            shasum -a 256 --check "mojotui-${GITHUB_REF_NAME}.tar.gz.sha256"
          fi
          mkdir -p "${RUNNER_TEMP}/source"
          tar -xzf "${RUNNER_TEMP}/archive/mojotui-${GITHUB_REF_NAME}.tar.gz" \
            --strip-components=1 -C "${RUNNER_TEMP}/source"
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: ${{ runner.temp }}/source
      - name: Build and inspect installed package
        working-directory: ${{ runner.temp }}/source
        run: |
          set -euo pipefail
          pixi run --locked package
          bash scripts/check-package-metadata.sh

  publish:
    name: Publish source release
    needs: [archive, source-check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: source-archive
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "mojotui-${GITHUB_REF_NAME}.tar.gz" \
            "mojotui-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --verify-tag --generate-notes \
            --title "Mojotui ${GITHUB_REF_NAME}"
