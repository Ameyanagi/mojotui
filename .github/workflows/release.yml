name: Release v0.1 source distribution

on:
  push:
    tags:
      - "v0.1.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify v0.1 release contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Match annotated tag and compiler to workspace metadata
        run: bash scripts/check-release-contract.sh

  check:
    name: Check v0.1 on ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify locked workspace
        run: pixi run --locked check

  publish:
    name: Publish source release
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Build source archive
        run: >-
          git archive --format=tar.gz
          --prefix="mojotui-${GITHUB_REF_NAME}/"
          --output="mojotui-${GITHUB_REF_NAME}.tar.gz"
          "${GITHUB_SHA}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "mojotui-${GITHUB_REF_NAME}.tar.gz"
          --verify-tag
          --generate-notes
          --title "Mojotui ${GITHUB_REF_NAME}"
