name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match tag, target, versions, dependencies, and changelog
        run: bash scripts/check-release-contract.sh

  archive:
    name: Build source archive once
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create source archive and checksum
        run: bash scripts/source-artifact.sh create "$GITHUB_SHA" "mojotui-${GITHUB_REF_NAME}" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: |
            mojotui-${{ github.ref_name }}.tar.gz
            mojotui-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  source-check:
    name: Check source archive on ${{ matrix.name }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: ${{ runner.temp }}/archive
      - name: Extract canonical source
        shell: bash
        run: bash scripts/source-artifact.sh restore "mojotui-${GITHUB_REF_NAME}" "${RUNNER_TEMP}/archive" "${RUNNER_TEMP}/source"
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: ${{ runner.temp }}/source
      - name: Verify canonical source
        working-directory: ${{ runner.temp }}/source
        run: pixi run --locked check

  package:
    name: Package source archive on ${{ matrix.name }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: ${{ runner.temp }}/archive
      - name: Extract canonical source
        shell: bash
        run: bash scripts/source-artifact.sh restore "mojotui-${GITHUB_REF_NAME}" "${RUNNER_TEMP}/archive" "${RUNNER_TEMP}/source"
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: ${{ runner.temp }}/source
      - name: Build and inspect installed package
        working-directory: ${{ runner.temp }}/source
        run: |
          set -euo pipefail
          pixi run --locked package
          bash scripts/check-package-metadata.sh

  publish:
    name: Publish source release
    needs: [archive, source-check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "mojotui-${GITHUB_REF_NAME}.tar.gz" \
            "mojotui-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --verify-tag --generate-notes \
            --title "Mojotui ${GITHUB_REF_NAME}"
