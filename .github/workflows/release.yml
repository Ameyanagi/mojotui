name: Release v0.1 source distribution

on:
  push:
    tags:
      - "v0.1.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify v0.1 release contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Match tag and pinned compiler to workspace metadata
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pixi.toml)"
          mojo_requirement="$(sed -n 's/^mojo = "\([^"]*\)"/\1/p' pixi.toml)"
          expected_tag="v${package_version}"

          if [[ -z "${package_version}" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          if [[ ! "${mojo_requirement}" =~ ^==[[:alnum:].]+$ ]]; then
            echo "Release builds require one exact Mojo compiler pin." >&2
            exit 1
          fi

  check:
    name: Check v0.1 on ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify locked workspace
        run: pixi run --locked check

  publish:
    name: Publish source release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Build source archive
        run: >-
          git archive --format=tar.gz
          --prefix="mojotui-${GITHUB_REF_NAME}/"
          --output="mojotui-${GITHUB_REF_NAME}.tar.gz"
          "${GITHUB_SHA}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "mojotui-${GITHUB_REF_NAME}.tar.gz"
          --verify-tag
          --generate-notes
          --title "Mojotui ${GITHUB_REF_NAME}"
