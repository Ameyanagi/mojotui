[workspace]
authors = ["Ameyanagi <ryuichi@ameyanagi.com>"]
channels = [
    "https://ameyanagi.github.io/mojo-channel",
    "https://conda.modular.com/max",
    "conda-forge",
]
name = "mojotui"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.2"

[tasks]
source-artifact-check = { cmd = "bash scripts/check-source-artifact.sh", description = "Precompile extracted sources and run a consumer against the artifact" }
source-artifact-test = { cmd = "python scripts/test-source-artifact.py", description = "Test the shared PR/release archive handoff and checksum failures" }
bench = { cmd = "mojo run -I . benchmarks/render.mojo", description = "Benchmark full, changed, and unchanged 80x24 ANSI frames" }
bench-collections = { cmd = "mojo run -I . benchmarks/collections.mojo", description = "Benchmark distant viewport jumps in 50k-row lists and tables" }
bench-large-list = { cmd = "mojo run -I . benchmarks/large_list.mojo", description = "Benchmark eager and lazy highlighted 50k-row lists with p50/p95" }
bench-editor = { cmd = "mojo run -I . benchmarks/editor.mojo", description = "Benchmark 10 MiB editor edits, history, and viewport rendering" }
profile-large-list-build = { cmd = "mojo build -O3 -g1 -I . benchmarks/large_list.mojo -o .pixi/large-list-profile", description = "Build the symbolized optimized large-list profiler binary" }
profile-render-build = { cmd = "mojo build -O3 -g1 -I . benchmarks/render.mojo -o .pixi/render-profile", description = "Build the symbolized optimized render profiler binary" }
check = { depends-on = ["test", "lint", "release-contract-test", "source-artifact-test"], description = "Run the complete non-mutating validation suite" }
compiler-lint = { cmd = "mojo precompile --Werror --warn-on-unstable-apis mojotui -o .pixi/mojotui-lint.mojoc", description = "Compile the package with warnings treated as errors" }
counter = { cmd = "mojo run -I . examples/counter.mojo", description = "Run the counter tutorial example" }
dashboard = { cmd = "mojo run -I . examples/dashboard.mojo", description = "Run the interactive system-monitor dashboard example" }
editor = { cmd = "mojo run -I . examples/editor.mojo", description = "Run the interactive text editor; pass a file path after --" }
format = { cmd = "bash scripts/format.sh", description = "Format Mojo source files in place" }
fuzzy = { cmd = "mojo run -I . examples/fuzzy.mojo", description = "Run the interactive fuzzy-picker example" }
form = { cmd = "mojo run -I . examples/form.mojo", description = "Run the focused validation and submit/cancel form example" }
virtual-list = { cmd = "mojo run -I . examples/virtual_list.mojo", description = "Run the lazy 50k-row list example" }
format-check = { cmd = "bash scripts/check-format.sh", description = "Verify Mojo formatting without modifying source files" }
hello-loop = { cmd = "mojo run -I . examples/hello_loop.mojo", description = "Run the manual-event-loop hello example" }
lint = { depends-on = ["format-check", "readme-check", "type-check", "unsafe-check"], description = "Run formatting, README, strict-type, and unsafe-boundary checks" }
package = { cmd = "rattler-build build --recipe conda.recipe/recipe.yaml -c https://ameyanagi.github.io/mojo-channel -c https://conda.modular.com/max -c conda-forge", description = "Build the local Conda package" }
precompile = { cmd = "mojo precompile mojotui -o .pixi/mojotui-check.mojoc", description = "Precompile the mojotui package" }
release-contract-test = { cmd = "bash scripts/test-release-contract.sh", description = "Verify release tag, version, and compiler guards" }
readme-check = { cmd = "bash scripts/check-readme.sh", description = "Compile the README's fenced Mojo blocks exactly as pasted" }
test = { cmd = "bash scripts/test.sh", description = "Run all Mojo TestSuite files" }
type-check = { depends-on = ["type-policy-check", "compiler-lint"], description = "Enforce static API policy and compile with warnings as errors" }
type-policy-check = { cmd = "bash scripts/check-types.sh", description = "Reject obsolete declarations and dynamic escape-hatch types" }
unsafe-check = { cmd = "bash scripts/check-unsafe.sh", description = "Reject unsafe or FFI operations outside the platform boundary" }

[dependencies]
mojo-moji = "==0.1.0"
mojo = "==1.0.0"
rattler-build = ">=0.74,<0.75"
ripgrep = ">=14,<16"
