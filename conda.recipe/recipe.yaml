context:
  version: "0.1.2"

package:
  name: mojo-mojotui
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mojo precompile --Werror --warn-on-unstable-apis -I ${{ PREFIX }}/lib/mojo mojotui -o ${{ PREFIX }}/lib/mojo/mojotui.mojoc

requirements:
  build:
    - mojo-compiler ==1.0.0
    - mojo-moji ==0.1.0
  host:
    - mojo-compiler ==1.0.0
    - mojo-moji ==0.1.0
  run:
    - mojo-compiler ==1.0.0
    - mojo-moji ==0.1.0

tests:
  - script:
      - mojo run test_package.mojo
    files:
      recipe:
        - test_package.mojo

about:
  homepage: https://github.com/Ameyanagi/mojotui
  repository: https://github.com/Ameyanagi/mojotui
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: A terminal user-interface library for Mojo.

extra:
  maintainers:
    - Ameyanagi
